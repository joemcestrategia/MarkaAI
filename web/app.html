<body>
  <!-- Splash screen: Premium -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 43%, #8B25C6 0%, #4A1081 45%, #16072B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }

    /* Orbit ring */
    #splash .orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 320px;
      margin-left: -160px;
      margin-top: -160px;
      border-radius: 50%;
      border: 1.2px solid rgba(255, 255, 255, 0.05);
      animation: spin 28s linear infinite;
      pointer-events: none;
    }

    #splash .orbit-ring::before {
      content: '';
      position: absolute;
      top: 16%;
      left: 16%;
      width: 68%;
      height: 68%;
      border-radius: 50%;
      border: 0.8px solid rgba(255, 255, 255, 0.035);
    }

    #splash .orbit-ring::after {
      content: '';
      position: absolute;
      top: 29%;
      left: 29%;
      width: 42%;
      height: 42%;
      border-radius: 50%;
      border: 1.2px dashed rgba(255, 255, 255, 0.045);
      border-spacing: 20%;
    }

    /* Gold dots on the inner dashed ring */
    #splash .orbit-dots {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 134px;
      height: 134px;
      margin-left: -67px;
      margin-top: -67px;
      animation: spin 28s linear infinite;
      pointer-events: none;
    }

    #splash .orbit-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.12);
      top: -3px;
      left: 50%;
      margin-left: -3px;
      transform-origin: 3px 70px;
    }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    #splash .brand-wrapper {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    #splash .logo {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 28px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 0 72px -12px rgba(255, 255, 255, 0.12),
        0 0 96px -20px rgba(255, 215, 0, 0.06);
      animation: float 2.6s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(-10px); }
      100% { transform: translateY(10px); }
    }

    #splash .wordmark {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 40px;
      line-height: 1.1;
      letter-spacing: 2.4px;
      color: white;
      margin-top: 32px;
    }

    #splash .wordmark .light {
      font-weight: 200;
    }

    #splash .wordmark .bold {
      font-weight: 800;
      opacity: 0.92;
    }

    #splash .dot-loader {
      display: flex;
      gap: 9px;
      z-index: 1;
      margin-top: 64px;
    }

    #splash .dot-loader .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #FFD700;
      box-shadow: 0 0 8px -1px rgba(255, 215, 0, 0.4);
      animation: pulse 1.5s ease-in-out infinite;
    }

    #splash .dot-loader .dot:nth-child(2) {
      animation-delay: 0.33s;
    }

    #splash .dot-loader .dot:nth-child(3) {
      animation-delay: 0.66s;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.55);
        opacity: 0.2;
      }
      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    #flutter-root {
      position: relative;
      z-index: 0;
    }
  </style>

  <div id="splash" aria-hidden="true">
    <div class="orbit-ring"></div>
    <div class="orbit-dots">
      <div class="orbit-dot" style="transform: rotate(0deg);"></div>
      <div class="orbit-dot" style="transform: rotate(45deg);"></div>
      <div class="orbit-dot" style="transform: rotate(90deg);"></div>
      <div class="orbit-dot" style="transform: rotate(135deg);"></div>
      <div class="orbit-dot" style="transform: rotate(180deg);"></div>
      <div class="orbit-dot" style="transform: rotate(225deg);"></div>
      <div class="orbit-dot" style="transform: rotate(270deg);"></div>
      <div class="orbit-dot" style="transform: rotate(315deg);"></div>
    </div>
    <div class="brand-wrapper">
      <img class="logo" src="assets/assets/images/icon.png" alt="MarkaAI">
      <div class="wordmark">
        <span class="light">Marka</span><span class="bold">AI</span>
      </div>
    </div>
    <div class="dot-loader" role="status" aria-label="Carregando">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <!-- Stripe Web SDK (Obrigatório para flutter_stripe_web) -->
  <script src="https://js.stripe.com/v3/" defer></script>

  <script>
    // Previne múltiplas abas no hot reload
    if (window.opener) {
      window.opener.location.href = window.location.href;
      window.close();
    }
  </script>
  <!-- Web Push: Service Worker + Subscription Bridge -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      // Register our push service worker
      navigator.serviceWorker.register('/sw.js').then(function (reg) {
        console.log('[SW] Registered:', reg.scope);
      }).catch(function (err) {
        console.warn('[SW] Registration failed:', err);
      });

      // Helper: converts a URL-safe base64 string to Uint8Array (needed for VAPID key)
      function _urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var rawData = window.atob(base64);
        var outputArray = new Uint8Array(rawData.length);
        for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
      }

      // Called by Flutter (via dart:js_interop) to subscribe and return subscription JSON
      window.markaSubscribePush = async function (vapidPublicKey) {
        try {
          if (!('PushManager' in window)) return null;
          var reg = await navigator.serviceWorker.ready;
          var existing = await reg.pushManager.getSubscription();
          if (existing) return JSON.stringify(existing.toJSON());
          var sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: _urlBase64ToUint8Array(vapidPublicKey),
          });
          return JSON.stringify(sub.toJSON());
        } catch (e) {
          console.warn('[PushManager] Subscribe error:', e);
          return null;
        }
      };

      // Called by Flutter to unsubscribe
      window.markaUnsubscribePush = async function () {
        try {
          var reg = await navigator.serviceWorker.ready;
          var sub = await reg.pushManager.getSubscription();
          if (sub) await sub.unsubscribe();
        } catch (e) {
          console.warn('[PushManager] Unsubscribe error:', e);
        }
      };
    })();
  </script>
  <script>
    window.flutterWebRenderer = 'html';
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    var _splashHidden = false;

    function hideSplash() {
      if (_splashHidden) return;
      var s = document.getElementById('splash');
      if (!s) return;
      console.log("MarkaAI: Hiding splash screen...");
      s.style.transition = 'opacity 500ms ease';
      s.style.opacity = '0';
      _splashHidden = true;
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 600);
    }

    function showSplashFallback() {
      if (_splashHidden) return;
      var s = document.getElementById('splash');
      if (!s) return;
      var msg = document.createElement('div');
      msg.style.cssText = 'color:rgba(255,255,255,0.9);text-align:center;font-family:system-ui,sans-serif;padding:20px;font-size:14px;line-height:1.6;position:absolute;bottom:60px;left:0;right:0;';
      msg.innerHTML = 'O app est\u00e1 demorando mais que o esperado.<br>Tente fechar outras abas e recarregue.';
      s.appendChild(msg);
    }

    // Flutter web usually dispatches this event when it renders first frame
    window.addEventListener('flutter-first-frame', hideSplash);
    // Fallback: after 8s show message; after 15s hide splash
    setTimeout(showSplashFallback, 8000);
    setTimeout(hideSplash, 15000);
  </script>
  <script>
    window.addEventListener("dragover", function (e) {
      e.preventDefault(); // Anula o comportamento padrão de "arrastar"
    }, false);

    window.addEventListener("drop", function (e) {
      e.preventDefault(); // Anula o comportamento padrão de "soltar" (abrir arquivo)
    }, false);
  </script>
</body>
