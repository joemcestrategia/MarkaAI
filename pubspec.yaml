name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # --- Principais ---
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mask_text_input_formatter: ^2.9.0
  pinput: ^6.0.1
  vector_math: ^2.1.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  http: ^1.6.0
  webview_flutter: ^4.2.0    
  
  # --- Firebase (ALINHAMENTO TOTAL - GERAÇÃO V3/V5) ---
  # Todos estes pacotes são compatíveis entre si
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_auth: ^5.3.0
  firebase_messaging: ^15.1.0
  cloud_functions: ^5.1.0  # Versão 5.x é necessária para funcionar com o Core 3.x
  
  # --- Utilitários ---
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  table_calendar: ^3.2.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.0.0
  image: ^4.0.17
  qr: ^2.1.0
  brasil_fields: ^1.18.0
  uuid: ^4.0.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3
  file_picker: ^8.1.4
  cross_file: ^0.3.4+2
  excel: ^4.0.0
  font_awesome_flutter: ^10.7.0
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  geolocator: ^9.0.2
  geocoding: ^2.0.5
  in_app_purchase: ^3.2.0
  
  # --- Gráficos ---
  fl_chart: ^0.66.0
  desktop_drop: ^0.7.0
  flutter_facebook_auth: ^7.1.5

  google_mobile_ads: ^7.0.0
  flutter_typeahead: ^5.2.0
  flutter_markdown: ^0.7.7+1
  share_plus: ^12.0.1
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/html/checkout_transparente.html

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"