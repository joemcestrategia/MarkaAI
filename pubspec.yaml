name: markaai
description: "A new Flutter project."
publish_to: 'none'

version: 1.8.9+11

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # --- Principais ---
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mask_text_input_formatter: ^2.9.0
  pinput: ^6.0.1
  vector_math: ^2.1.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  http: ^1.6.0
  webview_flutter: ^4.2.0    
  flutter_stripe: ^11.1.0
  rxdart: ^0.27.7
  

  
  # --- Utilitários ---
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  table_calendar: ^3.2.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.0.0
  image: ^4.0.17
  qr: ^3.0.2
  brasil_fields: ^1.18.0
  uuid: ^4.0.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3
  file_picker: ^8.1.4
  cross_file: ^0.3.4+2
  excel: ^4.0.0
  font_awesome_flutter: ^10.7.0
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  geolocator: ^9.0.2
  geocoding: ^2.0.5
  in_app_purchase: ^3.2.0
  
  # --- Mapas ---
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # --- Gráficos ---
  fl_chart: ^0.66.0
  desktop_drop: ^0.7.0
  flutter_facebook_auth: ^7.1.5
  supabase_flutter: ^2.12.0

  flutter_typeahead: ^5.2.0
  flutter_markdown: ^0.7.7+1
  share_plus: ^12.0.1
  web: ^1.0.0
  google_mobile_ads: ^5.1.0
  pdf: ^3.10.8
  printing: ^5.12.0
  permission_handler: ^12.0.1
  app_links: ^7.0.0
  firebase_messaging: ^16.2.0
  firebase_core: ^4.7.0
  windows_single_instance: ^1.1.0
  package_info_plus: ^9.0.1
  dio: ^5.4.3
  open_filex: ^4.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/payment/

flutter_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/icon.png"
  windows:
    generate: true
    image_path: "assets/images/icon.png"
  image_path: "assets/images/icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/icon.png"
  android_12:
    image: "assets/images/icon.png"
    color: "#ffffff"
  android: true
  ios: true
  web: false