<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Transparente - MarkaAI</title>
    <script src="https://sdk.mercadopago.com/js/v2" async></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 0;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .container {
            background: white;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px 20px 24px;
            max-width: 500px;
            margin: 0 auto;
        }
        h1 { font-size: 24px; color: #333; margin-bottom: 10px; font-weight: 600; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .valor-container {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .valor-label { font-size: 14px; color: #666; }
        .valor-amount { font-size: 24px; font-weight: 700; color: #667eea; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 14px; }
        input, select {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; font-family: inherit; transition: border-color 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .parcelamento-info {
            background: #f0f7ff; border: 2px solid #e3f2fd; border-radius: 8px;
            padding: 15px; margin-bottom: 20px; display: none;
        }
        .parcelamento-info.show { display: block; }
        .parcelamento-info h3 { font-size: 12px; color: #1976d2; margin-bottom: 10px; text-transform: uppercase; }
        .parcela-item { padding: 8px 0; border-bottom: 1px solid #e3f2fd; font-size: 13px; display: flex; justify-content: space-between; }
        .parcela-preco { font-weight: 600; color: #1976d2; }
        .loading { display: none; text-align: center; color: #666; font-size: 14px; margin-bottom: 15px; }
        .loading.show { display: block; }
        .error-message {
            background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px;
            margin-bottom: 15px; font-size: 13px; display: none; border-left: 4px solid #c62828;
        }
        .error-message.show { display: block; }
        button {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .footer { text-align: center; font-size: 11px; color: #999; margin-top: 15px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; color: #333; }
        .checkbox-label input[type="checkbox"] { width: 20px; height: 20px; accent-color: #667eea; }
        .card-brand { font-size: 12px; color: #667eea; font-weight: 600; margin-top: 4px; display: none; }
        .card-brand.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Finalizar Pagamento</h1>
        <p class="subtitle">Complete seus dados para pagar com segurança</p>

        <div class="valor-container">
            <span class="valor-label">Valor total:</span>
            <span class="valor-amount" id="valorTotal">R$ 0,00</span>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="installments">Parcelas</label>
                <select id="installments" required>
                    <option value="">Selecione o número de parcelas</option>
                </select>
                <div class="parcelamento-info" id="parcelamentInfo">
                    <h3>Parcelamento</h3>
                    <div id="parcelasLista"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="cardholderName">Nome no cartão</label>
                <input type="text" id="cardholderName" data-checkout="cardholderName" placeholder="Como aparece no cartão" required>
            </div>

            <div class="form-group">
                <label for="cardNumber">Número do cartão</label>
                <input type="text" id="cardNumber" data-checkout="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
                <div class="card-brand" id="cardBrand"></div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="cardExpirationDate">Vencimento</label>
                    <input type="text" id="cardExpirationDate" data-checkout="cardExpirationDate" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="form-group">
                    <label for="cardCvv">CVV</label>
                    <input type="text" id="cardCvv" data-checkout="cardCvv" placeholder="123" maxlength="4" required>
                </div>
            </div>

            <div class="form-group">
                <label for="cardholderIdentification">CPF do titular</label>
                <input type="text" id="cardholderIdentification" data-checkout="cardholderIdentification" placeholder="000.000.000-00" maxlength="14" required>
            </div>

            <div class="form-group" id="saveCardGroup">
                <label class="checkbox-label">
                    <input type="checkbox" id="saveCard" name="saveCard">
                    <span>Salvar cartão para próximas compras</span>
                </label>
            </div>

            <div class="loading" id="loading">
                <span class="spinner"></span> Processando pagamento...
            </div>

            <button type="submit" id="payButton">Pagar R$ 0,00</button>
        </form>

        <div class="footer">
            <p>Seu pagamento é seguro e protegido pelo Mercado Pago</p>
        </div>
    </div>

    <script>
        // ==================== VARIÁVEIS DO FLUTTER / URL ====================
        function getUrlParams() {
            const s = (typeof window.location !== 'undefined' && window.location.search) ? window.location.search : '';
            const p = {};
            s.replace(/^\?/, '').split('&').forEach(part => {
                const [k, v] = part.split('=');
                if (k && v) p[decodeURIComponent(k)] = decodeURIComponent(v);
            });
            return p;
        }
        const urlParams = getUrlParams();
        // Public key: primeiro tenta query string (Web), depois window.publicKey (Mobile injetado), depois fallback
        let PUBLIC_KEY = urlParams.publicKey || window.publicKey || 'APP_USR-456aad35-79ef-4f9a-a090-f71c7b1a5765';
        let VALOR = window.amount != null ? Number(window.amount) : (urlParams.amount ? parseFloat(urlParams.amount) : 0);
        let ORDER_ID = window.orderId || urlParams.orderId || '';
        let COLLECT_ONLY = (urlParams.collectOnly === '1') || (window.collectOnly === true);
        
        // Pre-fill client data from URL params (Web)
        if (urlParams.clientEmail) window.clientEmail = urlParams.clientEmail;
        if (urlParams.clientName) window.clientName = urlParams.clientName;
        if (urlParams.clientCpf) window.clientCpf = urlParams.clientCpf;

        let mp = null;
        let LAST_PAYMENT_METHOD_ID = null;
        let LAST_ISSUER_ID = null;

        window.updateCheckoutValues = function() {
            const amount = (window.amount != null ? Number(window.amount) : VALOR) || 0;
            VALOR = amount;
            const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('valorTotal').textContent = formatter.format(amount);
            updatePayButtonLabel(amount);
        };

        window.setPublicKey = function(pk) {
            if (!pk) return;
            PUBLIC_KEY = pk;
            try {
                if (window.MercadoPago) {
                    mp = new MercadoPago(PUBLIC_KEY, { locale: 'pt-BR' });
                }
            } catch (e) {
                console.warn('Erro ao reconfigurar public key:', e);
            }
        };

        function updatePayButtonLabel(amount) {
            const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
            const btn = document.getElementById('payButton');
            btn.textContent = COLLECT_ONLY ? 'Confirmar e ir para revisão' : ('Pagar ' + formatter.format(amount));
        }

        window.setCollectOnly = function(mode) {
            COLLECT_ONLY = !!mode;
            updatePayButtonLabel(VALOR);
        };

        window.applyClientPrefill = function() {
            if (window.clientEmail) document.getElementById('email').value = window.clientEmail;
            if (window.clientName) document.getElementById('cardholderName').value = window.clientName;
            if (window.clientCpf) document.getElementById('cardholderIdentification').value = window.clientCpf;
        };

        const BANDEIRAS = { visa: 'Visa', master: 'Mastercard', amex: 'Amex', naranja: 'Naranja', cabal: 'Cabal', debito: 'Débito', credito: 'Crédito' };
        function showBandeira(id) {
            const el = document.getElementById('cardBrand');
            if (!id) { el.classList.remove('show'); el.textContent = ''; return; }
            el.textContent = BANDEIRAS[id] || (id.charAt(0).toUpperCase() + id.slice(1));
            el.classList.add('show');
        }

        function ensureMercadoPagoLoaded() {
            return new Promise((resolve, reject) => {
                if (window.MercadoPago) return resolve();
                const existing = document.querySelector('script[data-mp-sdk]');
                if (!existing) {
                    const s = document.createElement('script');
                    s.src = 'https://sdk.mercadopago.com/js/v2';
                    s.async = true;
                    s.setAttribute('data-mp-sdk', '1');
                    s.onload = () => window.MercadoPago ? resolve() : reject(new Error('SDK não carregou'));
                    s.onerror = () => reject(new Error('Falha ao carregar SDK'));
                    document.head.appendChild(s);
                }
                let tries = 0;
                const timer = setInterval(() => {
                    if (window.MercadoPago) {
                        clearInterval(timer);
                        resolve();
                    } else if (++tries > 25) {
                        clearInterval(timer);
                        reject(new Error('SDK não carregou'));
                    }
                }, 200);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (urlParams.amount) VALOR = parseFloat(urlParams.amount) || 0;
            if (urlParams.orderId) ORDER_ID = urlParams.orderId;
            if (urlParams.collectOnly === '1') COLLECT_ONLY = true;
            const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('valorTotal').textContent = formatter.format(VALOR);
            updatePayButtonLabel(VALOR);

            ensureMercadoPagoLoaded()
                .then(() => {
                    mp = new MercadoPago(PUBLIC_KEY, { locale: 'pt-BR' });
                    setupFormListeners();
                    setupFormSubmit();
                    applyClientPrefill();
                    if (typeof FlutterChannel !== 'undefined') {
                        FlutterChannel.postMessage(JSON.stringify({ action: 'loaded' }));
                    }
                })
                .catch((e) => {
                    console.error('Erro SDK:', e);
                    showError('Falha ao carregar Mercado Pago. Verifique sua conexão.');
                });
        });

        function setupFormListeners() {
            // Formatações (igual ao seu código anterior)
            const cardNumber = document.getElementById('cardNumber');
            cardNumber.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '').substring(0, 19);
                v = v.replace(/(\d{4})/g, '$1 ').trim();
                e.target.value = v;
                if (v.replace(/\s/g, '').length >= 6) {
                    const bin = v.replace(/\s/g, '').substring(0, 6);
                    carregarParcelas(bin);
                }
            });

            const expiration = document.getElementById('cardExpirationDate');
            expiration.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '').substring(0, 4);
                if (v.length >= 2) {
                    let mm = v.substring(0, 2);
                    if (parseInt(mm, 10) > 12) mm = '12';
                    v = mm + '/' + v.substring(2, 4);
                }
                e.target.value = v;
            });

            const cvv = document.getElementById('cardCvv');
            cvv.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
            });

            const cpf = document.getElementById('cardholderIdentification');
            cpf.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.substring(0,11);
                e.target.value = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            });
        }

        async function carregarParcelas(bin) {
            const installmentsSelect = document.getElementById('installments');
            const infoDiv = document.getElementById('parcelamentInfo');
            const lista = document.getElementById('parcelasLista');
            const amount = (VALOR && VALOR > 0) ? VALOR : (window.amount ? Number(window.amount) : 0);
            
            if (!PUBLIC_KEY) {
                console.warn('⚠️ Public Key não configurada. Verifique shops/{shopId}.mercadopago.public_key');
            }
            if (amount <= 0) {
                console.warn('⚠️ Valor é 0. Verifique se amount foi passado corretamente.');
                showError('Valor não carregado. Recarregue a página.');
                return;
            }

            try {
                const url = `https://api.mercadopago.com/v1/payment_methods/installments?public_key=${encodeURIComponent(PUBLIC_KEY)}&amount=${amount}&bin=${bin}`;
                console.log('🔍 Buscando parcelas:', { publicKey: PUBLIC_KEY.substring(0, 20) + '...', amount, bin });
                const res = await fetch(url);
                if (!res.ok) {
                    throw new Error(`API retornou ${res.status}: ${res.statusText}`);
                }
                const data = await res.json();

                installmentsSelect.innerHTML = '<option value="">Selecione...</option>';
                lista.innerHTML = '';
                showBandeira(null);

                if (data.length > 0) {
                    const first = data[0];
                    const pmId = (first.payment_method_id || first.id || '').toString();
                    LAST_PAYMENT_METHOD_ID = pmId || null;
                    LAST_ISSUER_ID = first.issuer && first.issuer.id ? first.issuer.id : null;
                    showBandeira(pmId.toLowerCase());
                    (first.payer_costs || []).forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.installments;
                        opt.textContent = `${p.installments}x de R$ ${(p.installment_amount || 0).toFixed(2).replace('.', ',')}`;
                        installmentsSelect.appendChild(opt);
                        const item = document.createElement('div');
                        item.className = 'parcela-item';
                        item.innerHTML = `<span>${p.installments}x</span><span class="parcela-preco">R$ ${(p.total_amount || 0).toFixed(2).replace('.', ',')}</span>`;
                        lista.appendChild(item);
                    });
                    infoDiv.classList.add('show');
                } else {
                    showError('Não foi possível carregar parcelas. Verifique a Public Key e o valor.');
                }
            } catch (err) {
                console.error('Erro parcelas:', err);
                showBandeira(null);
                showError('Erro ao buscar parcelas. Tente novamente.');
            }
        }

        async function criarCardToken() {
            try {
                if (!mp) {
                    throw new Error('SDK do Mercado Pago não carregado');
                }
                const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
                const cardholderName = document.getElementById('cardholderName').value;
                const exp = document.getElementById('cardExpirationDate').value.split('/');
                const cardExpirationMonth = exp[0];
                const cardExpirationYear = exp[1] ? ('20' + exp[1]) : '';
                const securityCode = document.getElementById('cardCvv').value;
                const identificationNumber = document.getElementById('cardholderIdentification').value.replace(/\D/g, '');

                // SDK v2 pode expor createCardToken ou card.createToken
                if (typeof mp.createCardToken === 'function') {
                    const token = await mp.createCardToken({
                        cardNumber,
                        cardholderName,
                        cardExpirationMonth,
                        cardExpirationYear,
                        securityCode,
                        cardholderIdentification: {
                            type: 'CPF',
                            number: identificationNumber
                        }
                    });
                    return token && token.id;
                }
                if (mp.card && typeof mp.card.createToken === 'function') {
                    const token = await mp.card.createToken({
                        cardNumber,
                        cardholderName,
                        cardExpirationMonth,
                        cardExpirationYear,
                        securityCode,
                        identificationType: 'CPF',
                        identificationNumber
                    });
                    return token && token.id;
                }

                throw new Error('Método de tokenização não disponível no SDK');
            } catch (err) {
                console.error('Erro token:', err);
                showError('Falha no token: ' + (err && err.message ? err.message : 'erro desconhecido'));
                return null;
            }
        }

        function setupFormSubmit() {
            const form = document.getElementById('paymentForm');
            const btn = document.getElementById('payButton');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!form.checkValidity()) {
                    showError('Preencha todos os campos');
                    return;
                }

                btn.disabled = true;
                document.getElementById('loading').classList.add('show');

                try {
                    const cardToken = await criarCardToken();
                    if (!cardToken) throw new Error('Falha no token');

                    const installmentsValue = document.getElementById('installments').value;
                    const installments = parseInt(installmentsValue, 10) || 1;
                    const email = document.getElementById('email').value;
                    const saveCard = document.getElementById('saveCard').checked;

                    if (COLLECT_ONLY) {
                        FlutterChannel.postMessage(JSON.stringify({
                            action: 'card_data_confirmed',
                            cardToken: cardToken,
                            installments: installments,
                            email: email,
                            saveCard: saveCard,
                            paymentMethodId: LAST_PAYMENT_METHOD_ID,
                            issuerId: LAST_ISSUER_ID
                        }));
                    } else {
                        FlutterChannel.postMessage(JSON.stringify({
                            action: 'process_payment',
                            cardToken: cardToken,
                            installments: installments,
                            email: email,
                            paymentMethodId: LAST_PAYMENT_METHOD_ID,
                            issuerId: LAST_ISSUER_ID
                        }));
                    }
                } catch (err) {
                    showError(err.message || 'Erro inesperado');
                } finally {
                    btn.disabled = false;
                    document.getElementById('loading').classList.remove('show');
                }
            });
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
